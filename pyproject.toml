[project]
name = "japan-car-import-advisory"
version = "0.1.0"
description = "Japan Car Import Advisory Platform for Kenyan car buyers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fake-useragent>=2.2.0",
    "joblib>=1.5.3",
    "jupyterlab>=4.5.7",
    "lxml>=6.1.1",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "playwright>=1.60.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.49",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "tenacity>=9.1.4",
    "xgboost>=3.2.0",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.9",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
